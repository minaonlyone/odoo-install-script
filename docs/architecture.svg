<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Docker Compose layout: an odoo container built by the install script talking to a pgvector PostgreSQL 17 container, with volumes for custom addons, filestore and database data">
  <rect width="1200" height="560" rx="16" fill="#FBFAF8"/>
  <text x="40" y="52" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="bold" fill="#161A22">docker compose up -d</text>
  <text x="40" y="82" font-family="Helvetica, Arial, sans-serif" font-size="17" fill="#5A6270">The same odoo_install.sh runs inside the image, so a container and a server are built the same way.</text>

  <rect x="40" y="110" width="1120" height="330" rx="14" fill="none" stroke="#DCD6CF" stroke-dasharray="7 5"/>
  <text x="60" y="136" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#875A7B" font-weight="bold" letter-spacing="1">COMPOSE NETWORK</text>

  <!-- odoo -->
  <rect x="80" y="158" width="420" height="250" rx="12" fill="#FFFFFF" stroke="#875A7B" stroke-width="2"/>
  <text x="104" y="196" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#161A22">odoo</text>
  <text x="104" y="224" font-family="Menlo, Consolas, monospace" font-size="15" fill="#5A6270">ubuntu:24.04 + odoo_install.sh</text>
  <line x1="104" y1="240" x2="476" y2="240" stroke="#EEE9E4"/>
  <text x="104" y="268" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#161A22">Odoo 20.0 source</text>
  <text x="104" y="294" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#161A22">wkhtmltopdf (patched Qt)</text>
  <text x="104" y="320" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#161A22">rtlcss, deps from debian/control</text>
  <rect x="104" y="340" width="120" height="34" rx="17" fill="#F1EEEA"/><text x="164" y="363" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" fill="#161A22">:8069</text>
  <rect x="234" y="340" width="120" height="34" rx="17" fill="#F1EEEA"/><text x="294" y="363" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" fill="#161A22">:8072</text>

  <!-- db -->
  <rect x="700" y="158" width="380" height="250" rx="12" fill="#FFFFFF" stroke="#0F8F8C" stroke-width="2"/>
  <text x="724" y="196" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#161A22">db</text>
  <text x="724" y="224" font-family="Menlo, Consolas, monospace" font-size="15" fill="#5A6270">pgvector/pgvector:pg17</text>
  <line x1="724" y1="240" x2="1056" y2="240" stroke="#EEE9E4"/>
  <text x="724" y="268" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#161A22">PostgreSQL 17</text>
  <text x="724" y="294" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#161A22">role: odoo (not superuser)</text>
  <text x="724" y="320" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#161A22">vector extension in template1</text>
  <rect x="724" y="340" width="120" height="34" rx="17" fill="#E6F4F1"/><text x="784" y="363" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" fill="#0F6F6C">:5432</text>

  <!-- arrow -->
  <line x1="500" y1="270" x2="690" y2="270" stroke="#875A7B" stroke-width="2.5"/>
  <polygon points="700,270 686,263 686,277" fill="#875A7B"/>
  <text x="595" y="258" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="14" fill="#5A6270">db_host</text>

  <!-- volumes -->
  <text x="40" y="482" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#875A7B" letter-spacing="1">VOLUMES</text>
  <rect x="40"  y="496" width="340" height="40" rx="10" fill="#F1EEEA"/><text x="60" y="522" font-family="Menlo, Consolas, monospace" font-size="15" fill="#161A22">./addons  -&gt;  /odoo/custom/addons</text>
  <rect x="396" y="496" width="330" height="40" rx="10" fill="#F1EEEA"/><text x="416" y="522" font-family="Menlo, Consolas, monospace" font-size="15" fill="#161A22">odoo-data  -&gt;  /var/lib/odoo</text>
  <rect x="742" y="496" width="418" height="40" rx="10" fill="#E6F4F1"/><text x="762" y="522" font-family="Menlo, Consolas, monospace" font-size="15" fill="#0F6F6C">odoo-db  -&gt;  /var/lib/postgresql/data</text>
</svg>
