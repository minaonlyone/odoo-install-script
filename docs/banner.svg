<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Odoo 20 Install Script - one command, Ubuntu, Debian or Docker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B2029"/>
      <stop offset="100%" stop-color="#12161D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#875A7B"/>
      <stop offset="100%" stop-color="#0F8F8C"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="5" rx="2" fill="url(#accent)"/>
  <text x="64" y="104" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="bold" fill="#0F8F8C" letter-spacing="3">ODOO 20</text>
  <text x="64" y="176" font-family="Helvetica, Arial, sans-serif" font-size="62" font-weight="bold" fill="#FBFAF8">Install Script</text>
  <text x="64" y="220" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#A8B0BE">One command. Ubuntu, Debian, or Docker.</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#D7DCE4">
    <rect x="64"  y="248" width="168" height="40" rx="20" fill="#232A35"/><text x="148" y="274" text-anchor="middle">Ubuntu 24.04+</text>
    <rect x="244" y="248" width="150" height="40" rx="20" fill="#232A35"/><text x="319" y="274" text-anchor="middle">Debian 13+</text>
    <rect x="406" y="248" width="120" height="40" rx="20" fill="#232A35"/><text x="466" y="274" text-anchor="middle">Docker</text>
    <rect x="538" y="248" width="186" height="40" rx="20" fill="#232A35"/><text x="631" y="274" text-anchor="middle">PostgreSQL 17</text>
    <rect x="736" y="248" width="168" height="40" rx="20" fill="#232A35"/><text x="820" y="274" text-anchor="middle">Python 3.12</text>
  </g>

  <g transform="translate(940,70)">
    <rect x="0" y="0" width="200" height="150" rx="12" fill="#0F1319" stroke="#2A323E"/>
    <circle cx="20" cy="22" r="6" fill="#E0713F"/><circle cx="42" cy="22" r="6" fill="#E8C547"/><circle cx="64" cy="22" r="6" fill="#4FC08D"/>
    <text x="16" y="62"  font-family="Menlo, Consolas, monospace" font-size="15" fill="#4FC08D">$ ./odoo_install.sh</text>
    <text x="16" y="88"  font-family="Menlo, Consolas, monospace" font-size="15" fill="#6B7686">installing...</text>
    <text x="16" y="114" font-family="Menlo, Consolas, monospace" font-size="15" fill="#D7DCE4">Odoo 20.0 running</text>
    <text x="16" y="136" font-family="Menlo, Consolas, monospace" font-size="15" fill="#7AA2F7">:8069</text>
  </g>
</svg>
